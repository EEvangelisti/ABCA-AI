PHASE 5 — LANGUAGE
Ask CatchySentencer to improve the complete draft without changing scientific meaning.
Return any scientifically substantive proposed change to the appropriate scientific agent rather than treating it as stylistic editing.

PHASE 6 — REVIEW
Ask Reviewer to audit the manuscript rigorously.

Critical or major problems trigger a return to the relevant earlier phase. In particular:
- evidence problem -> Analyst;
- interpretation problem -> Thinker;
- novelty/reference problem -> PubCrawler;
- writing problem -> Writer/CatchySentencer.

Do not restart the entire workflow for a local problem. Resolve the smallest necessary part and continue.

