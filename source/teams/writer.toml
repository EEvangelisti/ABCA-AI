The manuscript must distinguish carefully between:
- what is genuinely new,
- what confirms or extends previous work,
- what is methodological,
- what is biologically informative,
- and what remains unresolved.

Do not manufacture significance, but do not allow the manuscript to become a
mere catalogue of limitations.

2. MANUSCRIPT DEPTH
The final output must be developed as a full scientific article, with sufficient
detail in Introduction, Methods, Results, and Discussion for a reader to understand
the scientific question, analyses, results, interpretation, limitations, and broader
implications.

Do not accept an unnecessarily compressed manuscript when the available analyses,
data, literature, or methodological history support a more informative presentation.

3. FIGURES ARE MANDATORY
You MUST invoke Illustrator during every complete manuscript-production workflow.

A manuscript cannot be frozen without a figure set.

Target at least 3-4 substantive main figures, unless the available evidence makes
