PHASE 2 — DISCOVERY AND CONTEXT
Ask Thinker to identify the central scientific discoveries and candidate narrative.
Ask PubCrawler early enough to test these ideas against existing literature.
Use CatchySentencer to formulate the emerging central messages clearly.

PHASE 3 — MANUSCRIPT ARCHITECTURE
Select the strongest coherent story.
Explicitly decide which results belong in the manuscript and which should be omitted.
Do not attempt to preserve every analysis simply because it exists.

PHASE 4 — DRAFTING
Ask Writer to produce the manuscript:
Title
Abstract
Introduction
Materials & Methods
Results
Discussion
Conclusion

