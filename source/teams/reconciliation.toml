INITIAL_EXPERIMENT_PROMPT = """
Perform a COMPLETE CROSS-CAMPAIGN RECONCILIATION of the three independent ABCA-AI zoospore model-discovery campaigns supplied in the input data.

The objective is to transform the three discovery campaigns into:

1. a scientifically reconciled and non-redundant model landscape;
2. a compact canonical candidate portfolio;
3. a CLEAN, EXECUTABLE ABCA PLUGIN implementing that reconciled portfolio for subsequent human-led refitting and validation.

The final plugin is a REQUIRED OUTPUT.

The plugin must not invent a synthetic consensus model by blending unrelated mechanisms. Instead, it should expose the retained canonical candidates as distinct executable model modes or clearly separated implementations within a common plugin architecture.

Every implemented canonical candidate must retain explicit provenance to the original campaign model or models from which it was reconciled.

The reconciliation stage must determine:
- what the three campaigns independently have in common;
- what genuinely differs;
- which models are equivalent, nested or redundant;
- which modelling principles recur;
- which unique hypotheses remain scientifically distinct;
- which compact set of candidates should be retained;
- how those retained candidates should be represented in a common ABCA plugin.

STRICT BOUNDARIES:

- Do NOT perform definitive scientific refitting.
- Do NOT optimize models against the full experimental data.
- Do NOT perform final predictive validation.
- Do NOT declare a final winning model.
- Do NOT merge distinct hypotheses into an unsupported hybrid.
- Do NOT silently change the mathematical meaning of an original candidate.

PARAMETERIZATION REQUIREMENT:

Because all retained canonical models will subsequently be refitted under a common human-led protocol, all scientifically meaningful model parameters must be externalized.

Do not hard-code fitted or fit-relevant parameters in the plugin source.

Each canonical model must:
- read its fit-relevant parameters from an external parameter file;
- use explicit parameter names and physical units;
- document required versus optional parameters;
- distinguish structural constants from refittable parameters;
- expose sensible validation/error messages when required parameters are missing;
- never silently substitute fitted defaults during scientific runs.

The reconciled plugin must therefore be immediately usable for systematic refitting without source-code modification.

PARAMETER FILE ARCHITECTURE:

All retained canonical models must use ONE shared external parameter file.

This file must contain one clearly named section per canonical model, e.g.:

[model.persistent]
...

[model.two_state]
...

The shared parameter file may contain a [common] section for quantities that are genuinely shared across all model modes, such as timestep, spatial scale, or other simulation-wide constants.

Only quantities with the same meaning across models should appear in [common].
Model-specific fitted parameters must remain inside their corresponding [model.<name>] section.

The reconciliation team must define and document this common parameter-file schema as part of the final plugin interface.

Implementation work IS required.

The final reconciled plugin must:
- build successfully;
- execute through the standard ABCA interface;
- expose all retained canonical candidates;
- expose their parameters explicitly;
- contain no hidden fitting step;
- preserve physical units, timestep semantics and random-seed behaviour;
- contain documented provenance for each model mode;
- include at least minimal smoke-test execution evidence.

Required outputs:

- campaign_inventory.md
- model_crosswalk.csv
- model_family_map.md
- recurrent_principles.csv
- campaign_differences.md
- reconciliation_audit.md
- consolidated_portfolio.md
- reconciled ABCA plugin source
- plugin registry entry if required
- plugin implementation map
- smoke-test evidence
- validation_handoff.md
- final_reconciliation_report.md

Finish the full reconciliation AND produce an executable plugin in this run.
"""

