Create or recover a persistent campaign_ledger.csv in the
campaign output directory before starting any cycle.

The ledger must record, for every cycle:
- cycle number
- candidate model identifier
- parent model identifier
- training subset IDs
- validation subset IDs
- simulation output directory
- evaluation REPORT.md path
- evaluation summary.csv path
- candidate score
- EMP-SLOW-FAST score
- benchmark-relative gain G
- previous best model
- decision (ACCEPT / REJECT / INCONCLUSIVE / INVALID)
- benchmark_beaten (true / false)
- current best model after decision

Maintain a single authoritative best-model record.
The authoritative best-model record always refers to the best
successfully evaluated IA candidate, independently of whether
it outperforms EMP-SLOW-FAST.
The first valid evaluated IA candidate is automatically accepted
as the initial BEST_AI_MODEL.
If resuming an interrupted campaign, recover the current best
from the existing ledger instead of restarting selection.
Never overwrite or discard historical records.

FOR EACH CYCLE (up to 20):
1. Confirm refinement_workspace/fitting/ is clear of previous XMLs/manifest. Execute ./select_training.sh in refinement_workspace to MOVE five fresh unique training XMLs. Record their identities and check actual usable track counts.
2. Mathematician proposes a precise, minimal improvement to one existing canonical/previously refined plugin, guided by archived analyst feedback; Pluginist implements a uniquely versioned registered model and tests it; Fitter calibrates solely with fitting/ XMLs and freezes parameters.toml.
3. Execute ./run_simulation.sh MODEL fitting/parameters.toml from refinement_workspace. Capture the ONE-LINE output path to the resulting five candidate XMLs. Check number, nonempty files, seed manifest, parameter checksum and smoke-test logs. Archive fitting/ XMLs and selection manifest into a cycle-specific archive BEFORE calling select_training.sh again; retain their provenance. Transfer ONLY the five XML files and model name to evaluation workspace; no plugin code, fitted parameter files or training XMLs.
4. Runner moves five previously unused validation XMLs from evaluation_workspace/validation_dataset/ into experimental/, stages the five challenger XMLs in ALT_MODEL/, executes ./run_evaluation.sh MODEL ALT_MODEL from evaluation_workspace, and retains the printed REPORT.md path. On success the wrapper archives validation and candidate XMLs in timestamped results/.../inputs/; on failure do not consume new batches or hide failed attempts. Do not move/modify the five EMP-SLOW-FAST reference XMLs.
5. Analyst reads actual CSV/config/report, computes SAME-BATCH candidate-vs-EMP gain using the frozen six-metric score (FOUR Wasserstein distribution errors + TWO curve RMSEs), then compares this cycle's REPORT.md with the archived REPORT.md for the current best IA model (UNPAIRED cross-cycle comparison). Report all components, variation and parsimony; Orchestrator applies the predeclared selection rule and transmits only diagnostic feedback, not validation trajectories, to Refinement.
