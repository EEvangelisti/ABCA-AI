Do not require the challenger to outperform EMP-SLOW-FAST
to become BEST_AI_MODEL.

Record benchmark success separately from the IA promotion decision.

Record rejected and inconclusive candidates as well.
Preserve their reports and model artifacts.
Before starting the next cycle, verify that the ledger,
best-model identifier and archived reports are consistent.

SEQUENTIAL BEST-MODEL SELECTION — TWO DISTINCT OBJECTIVES:

OBJECTIVE A — IMPROVE THE BEST IA MODEL:
Maintain one authoritative BEST_AI_MODEL across the campaign.

The first successfully evaluated, scientifically valid IA candidate
is automatically ACCEPTED as BEST_AI_MODEL, regardless of its
performance relative to EMP-SLOW-FAST.

For every subsequent valid candidate, compare its archived
REPORT.md and summary.csv with those of the current BEST_AI_MODEL.

Use benchmark-relative gain:
    G = 1 - candidate_mean_score / EMP_mean_score

A higher G indicates better benchmark-relative performance,
including when both candidates remain worse than EMP (G < 0).

Compare historical G values, all six normalized component errors,
score variability, model complexity and available diagnostics.

The evaluations use different experimental validation batches:
these comparisons are NOT paired. A common EMP reference does not
eliminate batch effects.

Promote a challenger when its improvement exceeds the predefined
selection margin, with no unacceptable component regression or
complexity increase. If improvement is too small or uncertain,
retain the incumbent and record INCONCLUSIVE or REJECT as appropriate.

Never rerun the incumbent merely to compare historical models.

OBJECTIVE B — OUTPERFORM EMP-SLOW-FAST:
Independently assess whether the candidate outperforms EMP on
the SAME five validation batches.

Record BENCHMARK_BEATEN when:
- candidate_mean_score < EMP_mean_score;
- at least 3 of the 5 paired replicates favor the candidate;
- evaluation validity and provenance checks pass.

BENCHMARK_BEATEN is a scientific milestone, NOT a prerequisite
for acceptance as BEST_AI_MODEL.

An IA candidate can therefore be ACCEPTED while still having
G < 0. Conversely, beating EMP must be reported separately
from the sequential IA promotion decision.

STOPPING:
Count consecutive valid candidates that fail to improve
BEST_AI_MODEL, not consecutive candidates that fail to beat EMP.
Pre-evaluation failures and provenance-invalid attempts must
be recorded separately. Stop at 20 cycles or according to
the predeclared stopping rule.

CYCLE AUDIT: Keep model ancestry, code/TOML hashes, selected train and validation filenames, source version, full five-run simulation directory, evaluation output directory, scores, normalized component errors, failure logs, human-approved exceptions, and accept/reject/inconclusive decision. DO NOT delete failed or superseded models. Stop at 20 cycles or predeclared early stopping; never reuse training/validation XMLs to fill new cycles. Validation feedback may steer future hypotheses, but the ultimate final independent test remains human-held and untouched. Write a reproducible final ledger, best model artifacts and a concise human-readable report. Never invent experiments or significance.
"""
