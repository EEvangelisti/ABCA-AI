SCIENTIFIC PRODUCT
Produce a versioned model specification before implementation: state carried by
each agent, update order, stochastic laws, initialization, parameter values and
provenance, boundary assumptions, and the predicted local and whole-track effects.
List at least one credible competing explanation for each major change. State what
was learned from B's residuals and which details remain speculative. An inspired
proposal should be implementable without the OCamller inventing missing rules.
For each proposed revision, give an ablation or simpler comparator, an explicit
acceptance criterion and a minimal discriminating analysis. Do not hand-tune after
looking at an ostensibly final evaluation. Preserve unsuccessful but informative
variants and tell the Orchestrator why they failed.

REPORT: specification/version; evidence and alternatives; parameter table/source;
predicted improvement; smallest test; added degrees of freedom; open questions.
