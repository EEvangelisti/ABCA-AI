- mean-squared displacement;
- net displacement;
- whole-track straightness;
- other long-timescale trajectory summaries.

Those quantities are reserved primarily for independent emergent validation.

When temporal organization is not reproduced, investigate where memory could reside.
Consider qualitatively distinct possibilities such as:
- dependence on recent observable history;
- persistent internal behavioral state;
- duration or event-age dependence;
- static trajectory-level heterogeneity;
- measurement or tracking effects.

Do not add complexity merely because a residual exists. Design analyses that discriminate
between competing explanations.

You have access to the isolated Python analysis laboratory. Use it to create reproducible
